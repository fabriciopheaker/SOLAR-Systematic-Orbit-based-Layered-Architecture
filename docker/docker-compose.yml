services:
  solar:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: solar

    working_dir: /solar

    volumes:
      - ..:/solar

    stdin_open: true
    tty: true

    environment:
      APP_ENV: DEV

      # Dentro do container, `localhost` NÃO serve: o encaminhamento de
      # porta do Docker entrega a requisição no IP da rede do container,
      # e quem escuta só em 127.0.0.1 nunca é alcançado. A variável do
      # ambiente tem precedência sobre o `nucleus/.env` (o `load_dotenv`
      # não sobrescreve o que já existe), então o `.env` continua sendo
      # o padrão para quem roda fora do Docker.
      DEV_HOST: 0.0.0.0

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    command: python server.py

  postgres:
    image: postgres:16-alpine

    container_name: solar-postgres

    environment:
      POSTGRES_DB: sirius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
